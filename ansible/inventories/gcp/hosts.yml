---
# Inventaire dynamique GCP — utilise le plugin gcp_compute
# Prérequis: pip install requests google-auth
# Usage: ansible-inventory -i inventories/gcp/ --list

plugin: google.cloud.gcp_compute
projects:
  - infrastructure-resiliente     # ← ton project_id GCP
regions:
  - europe-west1
filters:
  - status = RUNNING
groups:
  k3s_server: "'server' in name"
  data_nodes:  "'data' in name"
keyed_groups:
  - key: labels.role
    prefix: role
compose:
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP
auth_kind: application
