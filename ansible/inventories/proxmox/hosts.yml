---
# Inventaire Proxmox — remplir avec les IPs de tes VMs
# après avoir exécuté: terraform apply -var-file=environments/example-local.tfvars
#
# Tip: générer automatiquement depuis Terraform :
#   terraform -chdir=terraform/modules/local-k3s output -json \
#     | python3 ansible/scripts/gen_inventory.py > ansible/inventories/proxmox/hosts.yml

all:
  children:

    k3s_server:
      hosts:
        server-0:
          ansible_host: 192.168.1.10    # ← IP de ta VM server
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa

    data_nodes:
      hosts:
        data-0:
          ansible_host: 192.168.1.20    # ← IP VM data 0
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
        data-1:
          ansible_host: 192.168.1.21
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
        data-2:
          ansible_host: 192.168.1.22
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa

    k3s_agents:
      children:
        data_nodes:
