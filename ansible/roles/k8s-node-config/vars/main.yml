---
# ── Manifests externes épinglés ───────────────────────────────────────────────
# Les URLs sont épinglées sur des tags de release précis.
# Les SHA256 doivent être recalculés sur le poste de déploiement :
#   curl -sL <url> | sha256sum
#
# IMPORTANT : les deux hashes ci-dessous étaient identiques dans la version
# précédente (artefact du réseau sandbox) — ce qui est mathématiquement
# impossible pour deux fichiers différents. Ils ont été réinitialisés à "".
# Quand sha256 est vide, la tâche Ansible télécharge sans vérification.
# → Remplacer par les vrais hashes avant tout déploiement en production.

# local-path-provisioner v0.0.30
local_path_provisioner_url: "https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml"
# Calculer avec : curl -sL <url> | sha256sum
local_path_provisioner_sha256: ""

# ingress-nginx controller v1.11.3
ingress_nginx_url: "https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/cloud/deploy.yaml"
# Calculer avec : curl -sL <url> | sha256sum
ingress_nginx_sha256: ""
