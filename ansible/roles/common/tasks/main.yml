---
# Tâches communes à TOUS les nœuds (server + data)
# Appliquées avant containerd et k3s

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - jq
      - netcat-openbsd
      - nfs-common
      - open-iscsi
      - socat
      - conntrack
      - ipset
      - ipvsadm
    state: present

- name: Disable swap (required by Kubernetes)
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Load required kernel modules
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Set sysctl parameters (Kubernetes + OpenSearch)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: vm.max_map_count,                    value: "{{ vm_max_map_count }}" }
    - { key: fs.file-max,                         value: "{{ fs_file_max }}" }
    - { key: net.bridge.bridge-nf-call-iptables,  value: "1" }
    - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { key: net.ipv4.ip_forward,                 value: "1" }
    - { key: net.ipv4.conf.all.forwarding,        value: "1" }
    - { key: vm.swappiness,                       value: "1" }

- name: Set ulimits for opensearch and hadoop (limits.conf)
  ansible.builtin.blockinfile:
    path: /etc/security/limits.conf
    marker: "# {mark} ANSIBLE MANAGED — data-platform"
    block: |
      * soft nofile  {{ ulimit_nofile_soft }}
      * hard nofile  {{ ulimit_nofile_hard }}
      * soft memlock {{ ulimit_memlock_soft }}
      * hard memlock {{ ulimit_memlock_hard }}
      root soft nofile  {{ ulimit_nofile_soft }}
      root hard nofile  {{ ulimit_nofile_hard }}

# FIX: directory must be created BEFORE writing the file into it
- name: Ensure systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"

- name: Set ulimits in systemd (override for services)
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/ulimits.conf
    content: |
      [Manager]
      DefaultLimitNOFILE={{ ulimit_nofile_hard }}
      DefaultLimitMEMLOCK=infinity
    mode: "0644"
  notify: reload systemd
