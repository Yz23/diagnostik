[defaults]
inventory          = inventories/
roles_path         = roles/
# FIX H1: host_key_checking activé — MITM impossible sur SSH
# Prérequis : peupler known_hosts avant le premier run :
#   ssh-keyscan -H <ip1> <ip2> ... >> ~/.ssh/known_hosts
host_key_checking  = True
retry_files_enabled = False
stdout_callback    = yaml
gathering          = smart
fact_caching       = jsonfile
# FIX M4: répertoire dédié hors de /tmp (world-writable)
# Créer avec : mkdir -p ~/.ansible/fact_cache && chmod 700 ~/.ansible/fact_cache
fact_caching_connection = ~/.ansible/fact_cache
fact_caching_timeout = 3600
interpreter_python = auto_silent

[ssh_connection]
pipelining     = True
ssh_args       = -o ControlMaster=auto -o ControlPersist=60s
