<svg width="100%" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DIAGNOSTIK security architecture</title>
<desc>Four security layers: perimeter and network, authentication, end-to-end TLS encryption, and secrets management with CI scanning</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<!-- Section 1 -->
<text class="ts" x="30" y="30" fill="var(--s)">1 — Perimeter &amp; Network</text>
<g class="c-gray">
<rect x="30" y="42" width="180" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="120" y="65" text-anchor="middle" dominant-baseline="central">Ingress nginx</text>
<text class="ts" x="120" y="83" text-anchor="middle" dominant-baseline="central">TLS termination</text>
</g>
<g class="c-coral">
<rect x="226" y="42" width="228" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="65" text-anchor="middle" dominant-baseline="central">LoadBalancer</text>
<text class="ts" x="340" y="83" text-anchor="middle" dominant-baseline="central">GCP · AWS · Azure</text>
</g>
<g class="c-gray">
<rect x="470" y="42" width="180" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="560" y="65" text-anchor="middle" dominant-baseline="central">NodePort</text>
<text class="ts" x="560" y="83" text-anchor="middle" dominant-baseline="central">dev local k3s</text>
</g>
<!-- Section 2 -->
<line x1="30" y1="118" x2="650" y2="118" stroke="var(--t)" stroke-width="0.5" opacity="0.2"/>
<text class="ts" x="30" y="138" fill="var(--s)">2 — Authentication</text>
<g class="c-purple">
<rect x="30" y="150" width="300" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="180" y="173" text-anchor="middle" dominant-baseline="central">OpenSearch Security</text>
<text class="ts" x="180" y="191" text-anchor="middle" dominant-baseline="central">admin · roles · multi-tenant</text>
</g>
<g class="c-blue">
<rect x="350" y="150" width="300" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="500" y="173" text-anchor="middle" dominant-baseline="central">Dashboards Auth</text>
<text class="ts" x="500" y="191" text-anchor="middle" dominant-baseline="central">no X-Pack (free)</text>
</g>
<!-- Section 3 -->
<line x1="30" y1="226" x2="650" y2="226" stroke="var(--t)" stroke-width="0.5" opacity="0.2"/>
<text class="ts" x="30" y="246" fill="var(--s)">3 — End-to-end TLS</text>
<g class="c-teal">
<rect x="30" y="258" width="188" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="124" y="281" text-anchor="middle" dominant-baseline="central">Transport :9300</text>
<text class="ts" x="124" y="299" text-anchor="middle" dominant-baseline="central">inter-node OS</text>
</g>
<g class="c-teal">
<rect x="238" y="258" width="204" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="281" text-anchor="middle" dominant-baseline="central">HTTP :9200</text>
<text class="ts" x="340" y="299" text-anchor="middle" dominant-baseline="central">clients → cluster</text>
</g>
<g class="c-teal">
<rect x="462" y="258" width="188" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="556" y="281" text-anchor="middle" dominant-baseline="central">HTTPS :5601</text>
<text class="ts" x="556" y="299" text-anchor="middle" dominant-baseline="central">Dashboards access</text>
</g>
<!-- Section 4 -->
<line x1="30" y1="334" x2="650" y2="334" stroke="var(--t)" stroke-width="0.5" opacity="0.2"/>
<text class="ts" x="30" y="354" fill="var(--s)">4 — Secrets &amp; CI</text>
<g class="c-amber">
<rect x="30" y="366" width="188" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="124" y="389" text-anchor="middle" dominant-baseline="central">cert-manager</text>
<text class="ts" x="124" y="407" text-anchor="middle" dominant-baseline="central">internal PKI</text>
</g>
<g class="c-amber">
<rect x="238" y="366" width="204" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="389" text-anchor="middle" dominant-baseline="central">K8s Secrets</text>
<text class="ts" x="340" y="407" text-anchor="middle" dominant-baseline="central">create-secrets.sh</text>
</g>
<g class="c-amber">
<rect x="462" y="366" width="188" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="556" y="389" text-anchor="middle" dominant-baseline="central">Gitleaks CI</text>
<text class="ts" x="556" y="407" text-anchor="middle" dominant-baseline="central">0 secret committed</text>
</g>
</svg>
