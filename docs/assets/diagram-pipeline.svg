<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DIAGNOSTIK data pipeline</title>
<desc>Data sources flow through Logstash pipeline into HDFS HA and OpenSearch clusters, with YARN for compute and OpenSearch Dashboards for visualization</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<!-- Data sources -->
<g class="c-gray">
<rect x="232" y="20" width="216" height="50" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Data sources</text>
</g>
<!-- Arrow sources -> logstash -->
<line x1="340" y1="70" x2="340" y2="108" stroke="var(--t)" stroke-width="1" opacity="0.6" marker-end="url(#arrow)"/>
<!-- Logstash -->
<g class="c-amber">
<rect x="212" y="112" width="256" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="135" text-anchor="middle" dominant-baseline="central">Logstash</text>
<text class="ts" x="340" y="153" text-anchor="middle" dominant-baseline="central">pipeline · TCP · Beats · HTTP</text>
</g>
<!-- Arrow Logstash -> HDFS (dashed - optional) -->
<path d="M280 170 L170 218" fill="none" stroke="var(--t)" stroke-width="1" stroke-dasharray="5 3" opacity="0.5" marker-end="url(#arrow)"/>
<!-- Arrow Logstash -> OpenSearch -->
<path d="M400 170 L510 218" fill="none" stroke="var(--t)" stroke-width="1" opacity="0.6" marker-end="url(#arrow)"/>
<!-- HDFS HA -->
<g class="c-teal">
<rect x="30" y="222" width="260" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="160" y="245" text-anchor="middle" dominant-baseline="central">HDFS HA</text>
<text class="ts" x="160" y="263" text-anchor="middle" dominant-baseline="central">NN×2 · JN×3 · DN×3 · ZK×3</text>
</g>
<!-- OpenSearch -->
<g class="c-purple">
<rect x="390" y="222" width="260" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="520" y="245" text-anchor="middle" dominant-baseline="central">OpenSearch</text>
<text class="ts" x="520" y="263" text-anchor="middle" dominant-baseline="central">master×3 · data×3 · coord×2</text>
</g>
<!-- Arrow HDFS -> YARN -->
<line x1="160" y1="280" x2="160" y2="318" stroke="var(--t)" stroke-width="1" opacity="0.6" marker-end="url(#arrow)"/>
<!-- Arrow OpenSearch -> Dashboards -->
<line x1="520" y1="280" x2="520" y2="318" stroke="var(--t)" stroke-width="1" opacity="0.6" marker-end="url(#arrow)"/>
<!-- YARN -->
<g class="c-teal">
<rect x="30" y="322" width="260" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="160" y="345" text-anchor="middle" dominant-baseline="central">YARN</text>
<text class="ts" x="160" y="363" text-anchor="middle" dominant-baseline="central">RM×2 · NM DaemonSet</text>
</g>
<!-- OpenSearch Dashboards -->
<g class="c-purple">
<rect x="390" y="322" width="260" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="520" y="345" text-anchor="middle" dominant-baseline="central">OpenSearch Dashboards</text>
<text class="ts" x="520" y="363" text-anchor="middle" dominant-baseline="central">visualization · port 5601</text>
</g>
<!-- Footer labels -->
<text class="ts" x="160" y="396" text-anchor="middle" fill="var(--s)" opacity="0.6">Hadoop — storage + compute</text>
<text class="ts" x="520" y="396" text-anchor="middle" fill="var(--s)" opacity="0.6">OpenSearch — search + viz</text>
</svg>
