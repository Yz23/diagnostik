# ── OpenSearch Dashboards — Deployment ───────────────────────
# Image officielle : opensearchproject/opensearch-dashboards
# Équivalent 1:1 de Kibana, même port 5601, même UX.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: data-platform
  labels:
    app: opensearch-dashboards
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opensearch-dashboards
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: opensearch-dashboards
                topologyKey: kubernetes.io/hostname
      containers:
        - name: opensearch-dashboards
          # ← opensearch-dashboards, PAS kibana
          image: opensearchproject/opensearch-dashboards:2.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
          env:
            # Surcharge la config YAML pour le mot de passe (ne pas mettre dans le ConfigMap)
            - name: OPENSEARCH_HOSTS
              value: '["http://opensearch:9200"]'
            - name: OPENSEARCH_USERNAME
              value: "admin"
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: opensearch-dashboards-config
