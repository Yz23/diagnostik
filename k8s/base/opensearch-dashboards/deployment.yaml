apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: data-platform
  labels:
    app: opensearch-dashboards
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opensearch-dashboards
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      serviceAccountName: opensearch-dashboards
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: opensearch-dashboards
                topologyKey: kubernetes.io/hostname
      containers:
        - name: opensearch-dashboards
          image: opensearchproject/opensearch-dashboards:2.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: OPENSEARCH_HOSTS
              value: '["https://opensearch:9200"]'
            - name: OPENSEARCH_USERNAME
              value: "admin"
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
            - name: tls-certs
              mountPath: /usr/share/opensearch-dashboards/config/certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: opensearch-dashboards-config
        - name: tls-certs
          secret:
            secretName: opensearch-tls-certs
