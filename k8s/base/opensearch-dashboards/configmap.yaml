apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-dashboards-config
  namespace: data-platform
  labels:
    app: opensearch-dashboards
data:
  opensearch_dashboards.yml: |
    server.name: opensearch-dashboards
    server.host: "0.0.0.0"
    server.port: 5601

    # Use HTTPS towards OpenSearch (after enabling TLS on the OS side)
    # Remplacer http:// par https:// une fois les certs en place
    opensearch.hosts:
      - "https://opensearch:9200"

    # Reference the CA to validate the OpenSearch certificate
    opensearch.ssl.certificateAuthorities:
      - /usr/share/opensearch-dashboards/config/certs/ca.crt
    opensearch.ssl.verificationMode: full

    opensearch.username: "admin"
    opensearch.password: "${OPENSEARCH_PASSWORD}"
    opensearch.requestHeadersAllowlist:
      - authorization
      - securitytenant

    opensearch_security.multitenancy.enabled: true
    opensearch_security.multitenancy.tenants.preferred:
      - Private
      - Global
    opensearch_security.readonly_mode.roles:
      - kibana_read_only

    # cookie.secure MUST be true when TLS is enabled on the Ingress
    # Set to false only in local dev without TLS
    opensearch_security.cookie.secure: true

    logging.verbose: false
