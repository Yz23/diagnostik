# ── OpenSearch Dashboards — remplace Kibana ───────────────────
# Fork open-source de Kibana, compatible à 100% avec l'UI Kibana 7.x.
# Sécurité (auth, multi-tenancy, RBAC) incluse sans licence.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-dashboards-config
  namespace: data-platform
  labels:
    app: opensearch-dashboards
data:
  opensearch_dashboards.yml: |
    server.name: opensearch-dashboards
    server.host: "0.0.0.0"
    server.port: 5601

    # Connexion au service coordinator OpenSearch (remplace elasticsearch.hosts de Kibana)
    opensearch.hosts:
      - "http://opensearch:9200"

    opensearch.username: "admin"
    # Le mot de passe est injecté via la variable d'env OPENSEARCH_PASSWORD
    opensearch.password: "${OPENSEARCH_PASSWORD}"

    opensearch.requestHeadersAllowlist:
      - authorization
      - securitytenant

    # Multi-tenancy OpenSearch Security (équivalent X-Pack spaces, gratuit)
    opensearch_security.multitenancy.enabled: true
    opensearch_security.multitenancy.tenants.preferred:
      - Private
      - Global
    opensearch_security.readonly_mode.roles:
      - kibana_read_only

    # Logging
    logging.verbose: false

    # Cookie sécurisé (mettre true quand TLS activé en front)
    opensearch_security.cookie.secure: false
