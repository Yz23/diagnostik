# ResourceQuota + LimitRange — protection contre les workloads non bornés.
# Sans ces objets, un pod sans limits peut consommer toute la RAM du nœud.

apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-platform-quota
  namespace: data-platform
spec:
  hard:
    # Pods
    pods:                    "60"
    # CPU
    requests.cpu:            "24"
    limits.cpu:              "48"
    # Mémoire
    requests.memory:         "80Gi"
    limits.memory:           "128Gi"
    # Stockage
    persistentvolumeclaims:  "30"
    requests.storage:        "2Ti"
    # Services
    services:                "20"
    services.loadbalancers:  "2"
    # ConfigMaps / Secrets
    configmaps:              "30"
    secrets:                 "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: data-platform-limits
  namespace: data-platform
spec:
  limits:
    # Défauts pour les containers sans requests/limits explicites
    - type: Container
      default:
        cpu:    "500m"
        memory: "512Mi"
      defaultRequest:
        cpu:    "100m"
        memory: "128Mi"
      max:
        cpu:    "8"
        memory: "16Gi"
      min:
        cpu:    "50m"
        memory: "64Mi"
    # Limite pour les PVCs (éviter les volumes géants accidentels)
    - type: PersistentVolumeClaim
      max:
        storage: "600Gi"
      min:
        storage: "1Gi"
