# ── Service TCP ───────────────────────────────────────────────────────────────
# FIX : K8s ne supporte pas le même numéro de port avec des protocoles différents
# dans un seul Service. On sépare TCP et UDP en deux Services distincts.
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: data-platform
  labels:
    app: logstash
  annotations:
    # Prometheus scraping (si Prometheus Operator déployé dans le cluster)
    prometheus.io/scrape: "true"
    prometheus.io/port:   "9600"
    prometheus.io/path:   "/"
spec:
  type: ClusterIP
  selector:
    app: logstash
  ports:
    - name: tcp-input
      port: 5000
      targetPort: 5000
      protocol: TCP
    - name: beats
      port: 5044
      targetPort: 5044
      protocol: TCP
    - name: http-input
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: api
      port: 9600
      targetPort: 9600
      protocol: TCP
---
# ── Service UDP séparé ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: logstash-udp
  namespace: data-platform
  labels:
    app: logstash
spec:
  type: ClusterIP
  selector:
    app: logstash
  ports:
    - name: udp-input
      port: 5000
      targetPort: 5000
      protocol: UDP
