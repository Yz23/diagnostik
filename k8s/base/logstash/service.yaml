apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: data-platform
  labels:
    app: logstash
spec:
  type: ClusterIP
  selector:
    app: logstash
  ports:
    - name: tcp-input
      port: 5000
      targetPort: 5000
      protocol: TCP
    - name: udp-input
      port: 5000
      targetPort: 5000
      protocol: UDP
    - name: beats
      port: 5044
      targetPort: 5044
      protocol: TCP
    - name: http-input
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: api
      port: 9600
      targetPort: 9600
