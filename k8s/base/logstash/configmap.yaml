apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: data-platform
  labels:
    app: logstash
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: false
    pipeline.workers: 4
    pipeline.batch.size: 500
    pipeline.batch.delay: 50
    log.level: info

  main.conf: |
    input {
      tcp {
        port  => 5000
        codec => json_lines
        tags  => ["tcp", "app-logs"]
      }
      udp {
        port  => 5000
        codec => json_lines
        tags  => ["udp", "app-logs"]
      }
      beats {
        port => 5044
        tags => ["beats"]
      }
      http {
        port  => 8080
        codec => json
        tags  => ["http-input"]
      }
    }

    filter {
      if [timestamp] {
        date {
          match       => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
          target      => "@timestamp"
          remove_field => ["timestamp"]
        }
      }
      if ![message] and ![log] {
        drop {}
      }
      mutate {
        add_field => {
          "pipeline_version" => "1.0"
        }
      }
    }

    output {
      opensearch {
        hosts       => ["http://opensearch:9200"]
        user        => "admin"
        password    => "${OPENSEARCH_PASSWORD}"
        ssl_enabled => false
        index       => "logs-%{[tags][0]}-%{+YYYY.MM.dd}"
      }
    }
