apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history
  namespace: data-platform
  labels:
    app: spark
    role: historyserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
      role: historyserver
  template:
    metadata:
      labels:
        app: spark
        role: historyserver
    spec:
      serviceAccountName: spark
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        fsGroup: 185
      initContainers:
        - name: wait-for-hdfs
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z hdfs-namenode-0.hdfs-namenode-headless 8020; do sleep 5; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
        - name: prepare-eventlog-dir
          image: apache/hadoop:3.3.6
          command: ["/bin/bash", "-ec"]
          args:
            - |
              cp /hadoop-config/core-site.xml $HADOOP_CONF_DIR/core-site.xml
              cp /hadoop-config/hdfs-site.xml $HADOOP_CONF_DIR/hdfs-site.xml
              hdfs dfs -mkdir -p /spark/eventlog
              hdfs dfs -chmod 1777 /spark/eventlog
          volumeMounts:
            - name: hadoop-config
              mountPath: /hadoop-config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: historyserver
          image: apache/spark:3.5.3
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/spark-class"]
          args: ["org.apache.spark.deploy.history.HistoryServer"]
          ports:
            - name: http
              containerPort: 18080
          env:
            - name: SPARK_NO_DAEMONIZE
              value: "true"
            - name: SPARK_CONF_DIR
              value: "/spark-config"
          volumeMounts:
            - name: spark-config
              mountPath: /spark-config
              readOnly: true
            - name: hadoop-config
              mountPath: /opt/hadoop/etc/hadoop
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: spark-config
          configMap:
            name: spark-config
        - name: hadoop-config
          configMap:
            name: hadoop-config
