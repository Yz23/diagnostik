# ══════════════════════════════════════════════════════════════════════════════
# opensearch-pki.yaml — PKI interne cert-manager pour OpenSearch
# ══════════════════════════════════════════════════════════════════════════════
# This file is NOT in the base kustomization (not auto-applied).
# It is applied by : bash scripts/bootstrap-cert-manager.sh --opensearch-pki
# or manually : kubectl apply -f k8s/base/cert-manager/opensearch-pki.yaml
#
# Bootstrap sequence (cert-manager must be installed) :
#   1. SelfSigned ClusterIssuer → issues the CA certificate
#   2. CA Certificate (isCA:true) → stored in Secret opensearch-ca-secret
#   3. CA Issuer (namespace: data-platform) → uses opensearch-ca-secret
#   4. OpenSearch Certificate → automatically creates/renews opensearch-tls-certs
#
# The opensearch-tls-certs Secret is managed by cert-manager in production.
# In dev, it is created manually via : make secret-tls (scripts/generate-certs-dev.sh)
# ══════════════════════════════════════════════════════════════════════════════

# ── Step 1: SelfSigned ClusterIssuer (bootstrapper) ────────────────────────
# Used only to issue the root CA certificate.
# It does NOT directly sign OpenSearch certificates.
# CLEANUP: this ClusterIssuer can be deleted after CA bootstrap :
#   kubectl delete clusterissuer selfsigned-issuer
# (the data-platform CA Issuer is sufficient to issue OpenSearch certificates)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# ── Step 2: Root CA Certificate ────────────────────────────────────────────
# Dedicated CA for data-platform. Duration 10 years (internal CA — planned renewal).
# Creates the opensearch-ca-secret Secret in the data-platform namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opensearch-ca
  namespace: data-platform
spec:
  isCA: true
  commonName: opensearch-root-ca.data-platform
  subject:
    organizations: [data-platform]
  secretName: opensearch-ca-secret
  duration: 87600h       # 10 ans
  renewBefore: 8760h     # Renew 1 year before expiry
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Never   # IMPORTANT: Never for CAs — Always would generate a new key
                             # and would invalidate all leaf certificates signed by the old CA.
                             # cert-manager renews the CA cert with the same key (duration extension).
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# ── Step 3: CA Issuer (namespace data-platform) ─────────────────────────────
# Uses the opensearch-ca-secret Secret to sign internal certificates.
# Namespace-scoped (Issuer, not ClusterIssuer) — limits scope to namespace.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: opensearch-ca-issuer
  namespace: data-platform
spec:
  ca:
    secretName: opensearch-ca-secret
---
# ── Step 4: OpenSearch TLS Certificate ───────────────────────────────────────
# Automatically creates and renews the opensearch-tls-certs Secret.
# Used by: OpenSearch nodes (transport + HTTP), Logstash, Dashboards.
#
# SANs cover all internal cluster DNS names :
#   - ClusterIP Service (opensearch)
#   - Headless services (opensearch-master-headless, opensearch-data-headless)
#   - Coordinator Service (opensearch-coordinator)
#   - Full FQDNs with namespace and cluster domain
#   - localhost (kubelet probes)
#
# Keys created in the Secret :
#   tls.crt  — certificate (= pemcert in OpenSearch config)
#   tls.key  — private key (= pemkey in OpenSearch config)
#   ca.crt   — CA certificate (= pemtrustedcas in OpenSearch config)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opensearch-tls
  namespace: data-platform
spec:
  secretName: opensearch-tls-certs
  duration: 8760h          # 1 an
  renewBefore: 720h        # Renew 30 days before expiry
  commonName: opensearch.data-platform
  subject:
    organizations: [data-platform]
  dnsNames:
    # Service principal
    - opensearch
    - opensearch.data-platform
    - opensearch.data-platform.svc
    - opensearch.data-platform.svc.cluster.local
    # Nodes master (headless)
    - opensearch-master-headless
    - opensearch-master-headless.data-platform
    - opensearch-master-headless.data-platform.svc
    - opensearch-master-headless.data-platform.svc.cluster.local
    # Nodes data (headless)
    - opensearch-data-headless
    - opensearch-data-headless.data-platform
    - opensearch-data-headless.data-platform.svc
    - opensearch-data-headless.data-platform.svc.cluster.local
    # Coordinators
    - opensearch-coordinator
    - opensearch-coordinator.data-platform
    - opensearch-coordinator.data-platform.svc
    - opensearch-coordinator.data-platform.svc.cluster.local
    # Probes et localhost
    - localhost
  privateKey:
    algorithm: RSA
    size: 3072
    rotationPolicy: Always
  issuerRef:
    name: opensearch-ca-issuer
    kind: Issuer
    group: cert-manager.io
