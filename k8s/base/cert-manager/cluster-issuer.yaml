# ══════════════════════════════════════════════════════════════════════════════
# cert-manager — ClusterIssuers Let's Encrypt (template)
# ══════════════════════════════════════════════════════════════════════════════
# Ce fichier est un TEMPLATE avec un email placeholder.
# En production, utiliser le fichier configuré généré par configure-domain.sh :
#   bash scripts/configure-domain.sh <provider> <domain> <email>
#   kubectl apply -f k8s/base/cert-manager/cluster-issuer-configured.yaml
#
# Bootstrap complet :
#   bash scripts/bootstrap-cert-manager.sh <email> [--staging]
#
# Séquence recommandée :
#   1. bash scripts/configure-domain.sh gcp mycompany.com ops@mycompany.com
#   2. bash scripts/bootstrap-cert-manager.sh ops@mycompany.com --staging
#      → Valider que les certificats staging sont émis (DNS OK)
#   3. bash scripts/bootstrap-cert-manager.sh ops@mycompany.com
#      → Basculer en production
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_YOUR_EMAIL    # ← bash scripts/configure-domain.sh
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# ── Staging (rate limits relaxés — pour tester la configuration DNS) ──────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_YOUR_EMAIL    # ← bash scripts/configure-domain.sh
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
