apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-coordinator
  namespace: data-platform
  labels:
    app: opensearch
    role: coordinator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opensearch
      role: coordinator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: opensearch
        role: coordinator
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.0
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: cluster.name
              value: "opensearch-cluster"
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: node.roles
              value: ""
            - name: discovery.seed_hosts
              value: "opensearch-master-headless"
            - name: cluster.initial_master_nodes
              value: "opensearch-master-0,opensearch-master-1,opensearch-master-2"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /usr/share/opensearch/config/opensearch.yml
              subPath: opensearch.yml
            - name: tls-certs
              mountPath: /usr/share/opensearch/config/certs
              readOnly: true
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
          # FIX C3 : startupProbe — 10 min pour le premier démarrage avant livenessProbe
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  curl -fs -u "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD" \
                    https://localhost:9200/_cluster/health?local=true -k || exit 1
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  curl -fs -u "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD" \
                    https://localhost:9200/_cluster/health -k || exit 1
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  curl -fs -u "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD" \
                    https://localhost:9200/_cluster/health -k || exit 1
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
      serviceAccountName: opensearch
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: config
          configMap:
            name: opensearch-config
        - name: tls-certs
          secret:
            secretName: opensearch-tls-certs
            # Créer avec : make secret-tls  (ou : bash scripts/generate-certs-dev.sh)
            # En prod    : cert-manager alimente ce Secret automatiquement
