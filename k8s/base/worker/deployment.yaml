apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostik-worker
  namespace: data-platform
  labels:
    app: diagnostik-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diagnostik-worker
  template:
    metadata:
      labels:
        app: diagnostik-worker
    spec:
      serviceAccountName: diagnostik-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: diagnostik/worker:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: diagnostik-worker-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
