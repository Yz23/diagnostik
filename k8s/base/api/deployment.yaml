apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostik-api
  namespace: data-platform
  labels:
    app: diagnostik-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diagnostik-api
  template:
    metadata:
      labels:
        app: diagnostik-api
    spec:
      serviceAccountName: diagnostik-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: diagnostik/api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: diagnostik-api-config
            - secretRef:
                name: diagnostik-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
