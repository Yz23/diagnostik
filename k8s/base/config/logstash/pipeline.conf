# ── Logstash pipeline — source de vérité unique ───────────────────────────────
# Utilisé par :
#   • Docker Compose  → monté depuis config/logstash/pipeline.conf
#   • Kubernetes      → généré en ConfigMap via kustomize configMapGenerator
#
# Variables d'environnement :
#   OPENSEARCH_HOST     URL complète  (défaut: http://opensearch:9200)
#   OPENSEARCH_PASSWORD mot de passe admin
#   LS_SSL_ENABLED      "true" K8s prod / "false" Docker dev (défaut: "false")
#   LS_SSL_VERIFY       "true" / "false" (défaut: "false")
#   LS_SSL_CACERT       chemin CA cert   (défaut: /dev/null)
# ──────────────────────────────────────────────────────────────────────────────

input {
  tcp  { port => 5000; codec => json_lines; tags => ["tcp",  "app-logs"] }
  udp  { port => 5000; codec => json_lines; tags => ["udp",  "app-logs"] }
  beats { port => 5044; tags => ["beats"] }
  http  { port => 8080; codec => json; tags => ["http-input"] }
}

filter {
  if [timestamp] {
    date {
      match        => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
      target       => "@timestamp"
      remove_field => ["timestamp"]
    }
  }
  if ![message] and ![log] { drop {} }
  mutate { add_field => { "pipeline_version" => "1.0" } }
}

output {
  opensearch {
    hosts                        => ["${OPENSEARCH_HOST:http://opensearch:9200}"]
    user                         => "admin"
    password                     => "${OPENSEARCH_PASSWORD}"
    ssl_enabled                  => "${LS_SSL_ENABLED:false}"
    ssl_certificate_verification => "${LS_SSL_VERIFY:false}"
    cacert                       => "${LS_SSL_CACERT:/dev/null}"
    index                        => "logs-%{[tags][0]}-%{+YYYY.MM.dd}"
  }
}
