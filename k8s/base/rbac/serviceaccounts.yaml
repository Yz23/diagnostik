# Dedicated ServiceAccounts per component — principle of least privilege.
# Each pod has its own identity: no shared credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensearch
  namespace: data-platform
  labels: { app: opensearch }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash
  namespace: data-platform
  labels: { app: logstash }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensearch-dashboards
  namespace: data-platform
  labels: { app: opensearch-dashboards }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hadoop
  namespace: data-platform
  labels: { app: hadoop }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zookeeper
  namespace: data-platform
  labels: { app: zookeeper }
automountServiceAccountToken: false
---
# Dedicated NameNode ServiceAccount — token enabled for K8s-native fencing.
# Separate from the hadoop SA (DataNode/JournalNode/YARN) which does NOT need a token.
# Principle of least privilege : seul le NameNode peut appeler l'API K8s.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hdfs-namenode
  namespace: data-platform
  labels: { app: hdfs, role: namenode }
automountServiceAccountToken: true
