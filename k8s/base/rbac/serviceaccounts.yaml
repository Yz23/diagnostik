# ServiceAccounts dédiés par composant — principe de moindre privilège.
# Chaque pod a son identité propre : pas de credentials partagés.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensearch
  namespace: data-platform
  labels: { app: opensearch }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash
  namespace: data-platform
  labels: { app: logstash }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensearch-dashboards
  namespace: data-platform
  labels: { app: opensearch-dashboards }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hadoop
  namespace: data-platform
  labels: { app: hadoop }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zookeeper
  namespace: data-platform
  labels: { app: zookeeper }
automountServiceAccountToken: false
---
# ServiceAccount dédié NameNode — token activé pour le fencing K8s-natif.
# Séparé du SA hadoop (DataNode/JournalNode/YARN) qui n'a PAS besoin de token.
# Principle of least privilege : seul le NameNode peut appeler l'API K8s.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hdfs-namenode
  namespace: data-platform
  labels: { app: hdfs, role: namenode }
automountServiceAccountToken: true
