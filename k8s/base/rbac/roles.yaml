# Roles RBAC minimaux — chaque composant ne peut faire que ce dont il a besoin.
# Principe : aucune permission cluster-admin, aucun accès aux secrets d'autres composants.

# ── OpenSearch : lecture de ses propres ConfigMaps et Secrets ─────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensearch
  namespace: data-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["opensearch-config"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["opensearch-credentials", "opensearch-tls-certs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensearch
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: opensearch
    namespace: data-platform
roleRef:
  kind: Role
  name: opensearch
  apiGroup: rbac.authorization.k8s.io
---
