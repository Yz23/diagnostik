# ── HDFS NameNode : fencing K8s-natif ────────────────────────────────────────
# Permission minimale pour exécuter le fencing : supprimer les pods NameNode.
# Seul le SA hdfs-namenode reçoit ce rôle (pas le SA hadoop générique).
#
# Sécurité : ce rôle permet de supprimer N'IMPORTE quel pod dans le namespace.
# C'est le minimum requis car K8s RBAC ne supporte pas de filtre par labelSelector
# dans les rules.resourceNames pour les ressources créées dynamiquement.
# Mitigation : le script fence-namenode.sh ne supprime que les pods hdfs-namenode-N.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hdfs-namenode-fencer
  namespace: data-platform
rules:
  # get/list pour vérifier l'existence, delete pour le fencing
  # (fusionné en une règle — principe RBAC : regrouper les verbes par ressource)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # Lire sa propre config
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["hadoop-config", "hdfs-fence-script"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hdfs-namenode-fencer
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: hdfs-namenode
    namespace: data-platform
roleRef:
  kind: Role
  name: hdfs-namenode-fencer
  apiGroup: rbac.authorization.k8s.io
