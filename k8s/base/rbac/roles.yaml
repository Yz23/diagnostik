# ── Hadoop (HDFS + YARN) : lecture ConfigMap + Secrets ───────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hadoop
  namespace: data-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["hadoop-config"]
    verbs: ["get", "watch"]
  # NOTE : accès pods retiré — les composants Hadoop n'ont pas besoin
  #         de lister les pods pour fonctionner. Réactiver si un composant
  #         spécifique le nécessite avec resourceNames restriction.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hadoop
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: hadoop
    namespace: data-platform
roleRef:
  kind: Role
  name: hadoop
  apiGroup: rbac.authorization.k8s.io
---
