# ── HDFS NameNode : fencing K8s-natif ────────────────────────────────────────
# Minimal permission to run fencing: delete NameNode pods.
# Only the hdfs-namenode SA gets this role (not the generic hadoop SA).
#
# Sécurité : this role allows deleting ANY pod in the namespace.
# C'est le minimum requis car K8s RBAC ne supporte pas de filtre par labelSelector
# in rules.resourceNames for dynamically created resources.
# Mitigation : le script fence-namenode.sh ne supprime que les pods hdfs-namenode-N.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka
  namespace: data-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kafka-config"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kafka-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: kafka
    namespace: data-platform
roleRef:
  kind: Role
  name: kafka
  apiGroup: rbac.authorization.k8s.io
---
# ── Spark : driver/executors + HistoryServer, scoped au namespace ───────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark
  namespace: data-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["spark-config", "hadoop-config", "kafka-config"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kafka-credentials", "opensearch-credentials", "opensearch-tls-certs"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: data-platform
roleRef:
  kind: Role
  name: spark
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hdfs-namenode-fencer
  namespace: data-platform
rules:
  # get/list to check existence, delete for fencing
  # (merged into one rule — RBAC principle: group verbs per resource)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # Lire sa propre config
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["hadoop-config", "hdfs-fence-script"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hdfs-namenode-fencer
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: hdfs-namenode
    namespace: data-platform
roleRef:
  kind: Role
  name: hdfs-namenode-fencer
  apiGroup: rbac.authorization.k8s.io
