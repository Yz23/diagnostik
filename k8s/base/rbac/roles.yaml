# ── Hadoop (HDFS + YARN) : lecture ConfigMap + Secrets ───────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hadoop
  namespace: data-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["hadoop-config"]
    verbs: ["get", "watch"]
  # NOTE : pod access removed — Hadoop components do not need
  #         to list pods to function. Re-enable if a component
  #         specific resource needs it with resourceNames restriction.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hadoop
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: hadoop
    namespace: data-platform
roleRef:
  kind: Role
  name: hadoop
  apiGroup: rbac.authorization.k8s.io
---
