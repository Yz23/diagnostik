apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-namenode
  namespace: data-platform
  labels:
    app: hdfs
    role: namenode
spec:
  serviceName: hdfs-namenode-headless
  replicas: 2
  selector:
    matchLabels:
      app: hdfs
      role: namenode
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: hdfs
        role: namenode
    spec:
      # FIX M6 : contexte de sécurité pod
      # SA dédié avec automount token pour le fencing K8s-natif
      serviceAccountName: hdfs-namenode
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000     # UID hadoop dans l'image apache/hadoop
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: hdfs
                  role: namenode
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z zookeeper-0.zookeeper-headless 2181; do sleep 3; done
              until nc -z hdfs-journalnode-0.hdfs-journalnode-headless 8485; do sleep 3; done
              until nc -z hdfs-journalnode-1.hdfs-journalnode-headless 8485; do sleep 3; done
              until nc -z hdfs-journalnode-2.hdfs-journalnode-headless 8485; do sleep 3; done
          # FIX M6 : pas de privilèges élevés pour le init container de wait
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534  # nobody
      containers:
        - name: namenode
          image: apache/hadoop:3.3.6
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              cp /hadoop-config/core-site.xml  $HADOOP_CONF_DIR/core-site.xml
              cp /hadoop-config/hdfs-site.xml  $HADOOP_CONF_DIR/hdfs-site.xml
              ORDINAL=$(echo $HOSTNAME | awk -F'-' '{print $NF}')
              if [ "$ORDINAL" = "0" ] && [ ! -d /hadoop/dfs/name/current ]; then
                hdfs namenode -format -nonInteractive -force
                hdfs zkfc -formatZK -nonInteractive -force || true
              elif [ "$ORDINAL" = "1" ] && [ ! -d /hadoop/dfs/name/current ]; then
                until hdfs haadmin -getServiceState nn0 2>/dev/null | grep -q active; do
                  sleep 5
                done
                hdfs namenode -bootstrapStandby -nonInteractive
              fi
              hdfs namenode &
              NN_PID=$!
              hdfs zkfc &
              wait $NN_PID
          ports:
            - name: rpc
              containerPort: 8020
            - name: http
              containerPort: 9870
          env:
            - name: HADOOP_OPTS
              value: "-Xms1g -Xmx1g"
            # Downward API : injecte le namespace courant pour le script de fencing
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # FIX M6 : contexte de sécurité container
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: hadoop-config
              mountPath: /hadoop-config
            - name: namenode-data
              mountPath: /hadoop/dfs/name
            - name: fence-script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /index.html
              port: 9870
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: 9870
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: hadoop-config
          configMap:
            name: hadoop-config
        - name: fence-script
          configMap:
            name: hdfs-fence-script
            defaultMode: 0755  # exécutable
  volumeClaimTemplates:
    - metadata:
        name: namenode-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
