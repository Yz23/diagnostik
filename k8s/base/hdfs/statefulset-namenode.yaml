# ── HDFS NameNodes (HA — active/standby) ─────────────────────
# nn0 bootstraps first, nn1 syncs from nn0 via JournalNodes.
# Automatic failover via ZKFC sidecar.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-namenode
  namespace: data-platform
  labels:
    app: hdfs
    role: namenode
spec:
  serviceName: hdfs-namenode-headless
  replicas: 2
  selector:
    matchLabels:
      app: hdfs
      role: namenode
  podManagementPolicy: OrderedReady    # nn0 must start before nn1
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: hdfs
        role: namenode
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: hdfs
                  role: namenode
              topologyKey: kubernetes.io/hostname
      initContainers:
        # Wait for JournalNodes and ZooKeeper before formatting
        - name: wait-for-deps
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for ZooKeeper..."
              until nc -z zookeeper-0.zookeeper-headless 2181; do sleep 3; done
              echo "Waiting for JournalNodes..."
              until nc -z hdfs-journalnode-0.hdfs-journalnode-headless 8485; do sleep 3; done
              until nc -z hdfs-journalnode-1.hdfs-journalnode-headless 8485; do sleep 3; done
              until nc -z hdfs-journalnode-2.hdfs-journalnode-headless 8485; do sleep 3; done
              echo "All dependencies ready."
      containers:
        - name: namenode
          image: apache/hadoop:3.3.6
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              cp /hadoop-config/core-site.xml  $HADOOP_CONF_DIR/core-site.xml
              cp /hadoop-config/hdfs-site.xml  $HADOOP_CONF_DIR/hdfs-site.xml

              ORDINAL=$(echo $HOSTNAME | awk -F'-' '{print $NF}')

              # Format only nn0 on first start; nn1 bootstraps standby from nn0
              if [ "$ORDINAL" = "0" ] && [ ! -d /hadoop/dfs/name/current ]; then
                echo "Formatting NameNode nn0 and initialising ZooKeeper HA state..."
                hdfs namenode -format -nonInteractive -force
                hdfs zkfc -formatZK -nonInteractive -force || true
              elif [ "$ORDINAL" = "1" ] && [ ! -d /hadoop/dfs/name/current ]; then
                echo "Bootstrapping standby NameNode nn1 from nn0..."
                # Wait until nn0 is active
                until hdfs haadmin -getServiceState nn0 2>/dev/null | grep -q active; do
                  echo "Waiting for nn0 to become active..."; sleep 5
                done
                hdfs namenode -bootstrapStandby -nonInteractive
              fi

              echo "Starting NameNode (ordinal=$ORDINAL)..."
              hdfs namenode &
              NN_PID=$!
              # Start ZKFC in background for automatic failover
              hdfs zkfc &
              wait $NN_PID
          ports:
            - name: rpc
              containerPort: 8020
            - name: http
              containerPort: 9870
          env:
            - name: HADOOP_OPTS
              value: "-Xms1g -Xmx1g"
          volumeMounts:
            - name: hadoop-config
              mountPath: /hadoop-config
            - name: namenode-data
              mountPath: /hadoop/dfs/name
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /index.html
              port: 9870
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: 9870
            initialDelaySeconds: 90
            periodSeconds: 30
      volumes:
        - name: hadoop-config
          configMap:
            name: hadoop-config
  volumeClaimTemplates:
    - metadata:
        name: namenode-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
