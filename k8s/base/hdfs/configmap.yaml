apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-config
  namespace: data-platform
  labels:
    app: hadoop
data:
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>fs.defaultFS</name>
        <value>hdfs://hdfs-cluster</value>
      </property>
      <property>
        <name>ha.zookeeper.quorum</name>
        <value>zookeeper-0.zookeeper-headless:2181,zookeeper-1.zookeeper-headless:2181,zookeeper-2.zookeeper-headless:2181</value>
      </property>
      <property>
        <name>fs.trash.interval</name>
        <value>360</value>
      </property>
    </configuration>

  hdfs-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property><name>dfs.nameservices</name><value>hdfs-cluster</value></property>
      <property><name>dfs.ha.namenodes.hdfs-cluster</name><value>nn0,nn1</value></property>
      <property><name>dfs.namenode.rpc-address.hdfs-cluster.nn0</name><value>hdfs-namenode-0.hdfs-namenode-headless.data-platform.svc.cluster.local:8020</value></property>
      <property><name>dfs.namenode.rpc-address.hdfs-cluster.nn1</name><value>hdfs-namenode-1.hdfs-namenode-headless.data-platform.svc.cluster.local:8020</value></property>
      <property><name>dfs.namenode.http-address.hdfs-cluster.nn0</name><value>hdfs-namenode-0.hdfs-namenode-headless.data-platform.svc.cluster.local:9870</value></property>
      <property><name>dfs.namenode.http-address.hdfs-cluster.nn1</name><value>hdfs-namenode-1.hdfs-namenode-headless.data-platform.svc.cluster.local:9870</value></property>
      <property>
        <name>dfs.namenode.shared.edits.dir</name>
        <value>qjournal://hdfs-journalnode-0.hdfs-journalnode-headless.data-platform.svc.cluster.local:8485;hdfs-journalnode-1.hdfs-journalnode-headless.data-platform.svc.cluster.local:8485;hdfs-journalnode-2.hdfs-journalnode-headless.data-platform.svc.cluster.local:8485/hdfs-cluster</value>
      </property>
      <property><name>dfs.client.failover.proxy.provider.hdfs-cluster</name><value>org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider</value></property>
      <property><name>dfs.ha.automatic-failover.enabled</name><value>true</value></property>

      <!--
        FENCING K8S-NATIF :
        Le script /scripts/fence-namenode.sh utilise l'API Kubernetes pour
        force-delete le pod NameNode défaillant (gracePeriodSeconds=0).

        Flux : ZKFC détecte la perte de leadership ZK → appelle fence-namenode.sh
        avec le DNS du NN à fencer → script DELETE le pod via l'API K8s → pod mort.

        Fallback shell(/bin/true) : si le script échoue (ex: pod déjà supprimé,
        API K8s indisponible), on accepte le failover quand même. ZKFC + ZK
        assurent qu'un seul NN peut écrire dans ZK comme actif simultanément.

        Prérequis :
          • ConfigMap hdfs-fence-script monté dans le pod NameNode
          • ServiceAccount hdfs-namenode avec automountServiceAccountToken: true
          • RBAC Role hdfs-namenode-fencer : pods/delete dans le namespace
          • Variable d'env POD_NAMESPACE injectée via Downward API
      -->
      <property>
        <name>dfs.ha.fencing.methods</name>
        <value>shell(/scripts/fence-namenode.sh);shell(/bin/true)</value>
      </property>
      <property><name>dfs.replication</name><value>3</value></property>
      <property><name>dfs.datanode.data.dir</name><value>/hadoop/dfs/data</value></property>
      <property><name>dfs.namenode.name.dir</name><value>/hadoop/dfs/name</value></property>
      <property><name>dfs.journalnode.edits.dir</name><value>/hadoop/dfs/journal</value></property>
      <property><name>dfs.blocksize</name><value>134217728</value></property>
    </configuration>

  yarn-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property><name>yarn.resourcemanager.ha.enabled</name><value>true</value></property>
      <property><name>yarn.resourcemanager.cluster-id</name><value>yarn-cluster</value></property>
      <property><name>yarn.resourcemanager.ha.rm-ids</name><value>rm0,rm1</value></property>
      <property><name>yarn.resourcemanager.hostname.rm0</name><value>yarn-resourcemanager-0.yarn-resourcemanager-headless.data-platform.svc.cluster.local</value></property>
      <property><name>yarn.resourcemanager.hostname.rm1</name><value>yarn-resourcemanager-1.yarn-resourcemanager-headless.data-platform.svc.cluster.local</value></property>
      <property><name>yarn.resourcemanager.zk-address</name><value>zookeeper-0.zookeeper-headless:2181,zookeeper-1.zookeeper-headless:2181,zookeeper-2.zookeeper-headless:2181</value></property>
      <property><name>yarn.nodemanager.aux-services</name><value>mapreduce_shuffle</value></property>
      <property><name>yarn.nodemanager.aux-services.mapreduce_shuffle.class</name><value>org.apache.hadoop.mapred.ShuffleHandler</value></property>
      <property><name>yarn.resourcemanager.scheduler.class</name><value>org.apache.hadoop.yarn.server.resourcemanager.scheduler.capacity.CapacityScheduler</value></property>
      <property><name>yarn.nodemanager.resource.memory-mb</name><value>4096</value></property>
      <property><name>yarn.nodemanager.resource.cpu-vcores</name><value>2</value></property>
      <property><name>yarn.log-aggregation-enable</name><value>true</value></property>
      <property><name>yarn.nodemanager.remote-app-log-dir</name><value>/yarn/logs</value></property>
      <property><name>yarn.log.server.url</name><value>http://yarn-historyserver:19888/jobhistory/logs</value></property>
    </configuration>

  mapred-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property><name>mapreduce.framework.name</name><value>yarn</value></property>
      <property><name>mapreduce.jobhistory.address</name><value>yarn-historyserver:10020</value></property>
      <property><name>mapreduce.jobhistory.webapp.address</name><value>yarn-historyserver:19888</value></property>
      <property><name>mapreduce.map.memory.mb</name><value>1024</value></property>
      <property><name>mapreduce.reduce.memory.mb</name><value>2048</value></property>
      <property><name>mapreduce.map.java.opts</name><value>-Xmx768m</value></property>
      <property><name>mapreduce.reduce.java.opts</name><value>-Xmx1536m</value></property>
    </configuration>
