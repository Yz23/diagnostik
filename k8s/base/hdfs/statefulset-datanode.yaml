apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-datanode
  namespace: data-platform
  labels:
    app: hdfs
    role: datanode
spec:
  serviceName: hdfs-datanode-headless
  replicas: 3
  selector:
    matchLabels:
      app: hdfs
      role: datanode
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: hdfs
        role: datanode
    spec:
      serviceAccountName: hadoop
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hdfs
                    role: datanode
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-namenode
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534  # nobody
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z hdfs-namenode-0.hdfs-namenode-headless 8020; do sleep 5; done
      containers:
        - name: datanode
          image: apache/hadoop:3.3.6
          command: ["/bin/bash", "-c"]
          args:
            - |
              cp /hadoop-config/core-site.xml $HADOOP_CONF_DIR/core-site.xml
              cp /hadoop-config/hdfs-site.xml $HADOOP_CONF_DIR/hdfs-site.xml
              hdfs datanode
          ports:
            - name: data
              containerPort: 9866
            - name: http
              containerPort: 9864
            - name: ipc
              containerPort: 9867
          env:
            - name: HADOOP_OPTS
              value: "-Xms1g -Xmx1g"
          volumeMounts:
            - name: hadoop-config
              mountPath: /hadoop-config
            - name: data
              mountPath: /hadoop/dfs/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /index.html
              port: 9864
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 9864
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: hadoop-config
          configMap:
            name: hadoop-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 100Gi
