# Reduces all multi-replica StatefulSets to 1 for k3s single-node.
# Sans ce patch : 3 masters OS + 3 ZK + 2 NameNodes + 3 JournalNodes = OOM garanti.
# This file is applied ONLY by the local/ overlay — not on cloud.

# OpenSearch master : 3 → 1  (discovery.type=single-node dans le configmap)
- op: replace
  path: /spec/replicas
  value: 1
