# Reduce resource requests for local / Proxmox environments
# Patches OpenSearch master nodes
- target:
    kind: StatefulSet
    name: opensearch-master
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "1Gi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "1Gi"
    - op: replace
      path: /spec/template/spec/containers/0/env/6/value
      value: "-Xms512m -Xmx512m"
- target:
    kind: StatefulSet
    name: opensearch-data
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "2Gi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "2Gi"
    - op: replace
      path: /spec/template/spec/containers/0/env/6/value
      value: "-Xms1g -Xmx1g"
