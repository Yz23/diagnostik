apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: opensearch-data
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: hdfs-datanode
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: hdfs-journalnode
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: hdfs-namenode
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: zookeeper

  # ── Ingress domain — generated by scripts/configure-domain.sh ─────────────────
  # The patches/ingress-domain.yaml file is gitignored (deployment-specific).
  # Generate with : bash scripts/configure-domain.sh gcp <domain> [email]
  # Without this patch, Ingress keeps REPLACE_WITH_YOUR_DOMAIN (non-functional).
