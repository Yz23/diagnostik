apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: opensearch-data
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: hdfs-datanode
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: hdfs-journalnode
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: hdfs-namenode
  - path: patches/storageclass.yaml
    target:
      kind: StatefulSet
      name: zookeeper

  # ── Domaine Ingress — généré par scripts/configure-domain.sh ─────────────────
  # Le fichier patches/ingress-domain.yaml est gitignore (spécifique au déploiement).
  # Générer avec : bash scripts/configure-domain.sh gcp <domain> [email]
  # Sans ce patch, les Ingress conservent REPLACE_WITH_YOUR_DOMAIN (non fonctionnel).
