[project]
name = "diagnostik-common"
version = "0.1.0"
description = "Shared contracts and runtime helpers for Diagnostik Community Platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
