[project]
name = "diagnostik-api"
version = "0.1.0"
description = "FastAPI service for Diagnostik Community Platform"
requires-python = ">=3.11"
dependencies = [
  "diagnostik-common",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "httpx>=0.27,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "pip-audit>=2.7,<3",
  "bandit>=1.7,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
